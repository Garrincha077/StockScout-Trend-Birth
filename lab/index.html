<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StockScout Trend Birth — Daily Review Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><strong>Trend Birth Review Lab</strong><span id="runMeta">Učitavanje…</span></div>
    <div class="top-controls">
      <select id="chartPeriod" aria-label="Razdoblje charta">
        <option value="3m">3M · Daily</option>
        <option value="6m">6M · Daily</option>
        <option value="1y" selected>1Y · Daily</option>
        <option value="5y">5Y · Weekly</option>
      </select>
      <select id="sort" aria-label="Sortiranje kandidata">
        <option value="default">Default sort</option>
        <option value="kell-score">Kell Focus ↓</option>
        <option value="readiness">Readiness ↓</option>
        <option value="quality">Quality ↓</option>
        <option value="trend-birth">Trend Birth stage ↓</option>
        <option value="evidence">Evidence ↓</option>
        <option value="rvol">RVOL ↓</option>
        <option value="trendbirth">Trend Birth stage ↓</option>
      </select>
      <input id="search" type="search" placeholder="Ticker…" aria-label="Pretraži ticker">
    </div>
  </header>
  <nav id="filters" class="filters" aria-label="Filter kandidata">
    <div class="mobile-filter-head">
      <strong>Filters</strong>
      <button type="button" id="mobileFiltersClose">Done</button>
    </div>
    <span class="filter-group-label">Universe</span>
    <button data-universe="all" class="active">All</button>
    <button data-universe="bottom-fishing">Bottom</button>
    <button data-universe="next">Next</button>
    <button data-universe="ryan-original">Ryan</button>
    <button data-universe="watchlist" id="watchlistUniverse">★ Watchlist (0)</button>

    <span class="filter-group-label">Screens</span>
    <button data-filter="none" class="active">Clear filters</button>
    <button data-filter="kell-any">Kell Hits</button>
    <button data-filter="kell_52w_high">52W</button>
    <button data-filter="kell_unusual_volume">Vol ≥2x</button>
    <button data-filter="kell_rvol_3x">RVOL ≥3x</button>
    <button data-filter="kell_rs_leader">RS Leader</button>
    <button data-filter="kell_bull_snort">Bull Snort</button>
    <button data-filter="kell_momentum_3m_50">3M +50%</button>
    <button data-filter="kell_doubler_ytd">Doublers YTD</button>
    <button data-filter="kell_gapper">Gappers</button>
    <button data-filter="kell_strength_on_down_day">Strength ↓Day</button>

    <span class="filter-group-label">Trend Birth Radar</span>
    <button data-filter="tb:2">2/4 Watch Closely</button>
    <button data-filter="tb:3">3/4 Ready</button>
    <button data-filter="tb:4">4/4 Trigger</button>

    <span class="filter-group-label">Kell Cycle Stage</span>
    <button data-filter="stage:reversal_extension">Reversal Ext.</button>
    <button data-filter="stage:wedge_pop">Wedge Pop</button>
    <button data-filter="stage:ema_crossback">Crossback</button>
    <button data-filter="stage:base_n_break">Base n' Break</button>
    <button data-filter="stage:exhaustion_extension">Exhaustion</button>
    <button data-filter="stage:wedge_drop">Wedge Drop</button>
    <button data-filter="stage:trend_ema_support">Trend / EMA</button>
    <button data-filter="stage:downtrend_repair">Repair</button>
    <button data-filter="stage:transition">Transition</button>

    <span class="filter-group-label">Setups</span>
    <button data-filter="kell_buyable_gap_proxy">Buyable Gap</button>
    <button data-filter="kell_wedge_pop">Wedge Pop setup</button>
    <button data-filter="kell_ema_crossback">Crossback setup</button>
    <button data-filter="kell_base_n_break">Base n' Break setup</button>
    <button data-filter="kell_tightening">Tightening</button>
    <button data-filter="kell_breakout_proximity">Near Breakout</button>

    <span class="filter-group-label">Context</span>
    <button data-filter="kell_focus">Kell Focus</button>
    <button data-filter="kell_name_selection_ok">Kell Liquid</button>
    <button data-filter="kell_growth_context">Growth</button>
    <button data-filter="kell_rs_divergence">RS Divergence</button>
    <button data-filter="kell_weekly_trend_ok">Weekly 10EMA</button>
    <button data-filter="kell_ema_readiness">EMA Ready</button>
    <button data-filter="kell-score">Kell ≥60</button>
    <button data-filter="multi">Multi-hit</button>
    <button data-filter="action">Action</button>
  </nav>
  <div id="mobileFilterBackdrop" class="mobile-filter-backdrop" hidden></div>
  <div id="activeFilterBar" class="active-filter-bar" hidden aria-live="polite"></div>
  <nav id="quickViews" class="quick-views" aria-label="Brzi pregledi">
    <span class="quick-view-label">Quick</span>
    <button type="button" data-quick-view="changed">Changed</button>
    <button type="button" data-quick-view="trendbirth">Trend Birth</button>
    <button type="button" data-quick-view="ready">Ready</button>
    <button type="button" data-quick-view="leaders">Leaders</button>
    <button type="button" data-quick-view="breakout">Breakout</button>
    <button type="button" data-quick-view="tbready">TB Ready</button>
    <button type="button" data-quick-view="tbtrigger">TB Trigger</button>
    <button type="button" data-quick-view="extended">Extended</button>
    <button type="button" data-quick-view="reset">Reset</button>
    <button type="button" id="mobileFiltersToggle" class="mobile-filter-toggle" aria-controls="filters" aria-expanded="false">Filters</button>
  </nav>
  <main>
    <div id="status" class="status">Učitavam dnevne kandidate…</div>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <dialog id="detail">
    <button id="closeDetail" class="close" aria-label="Zatvori">×</button>
    <div class="detail-nav" aria-label="Navigacija kroz kandidate">
      <button type="button" id="prevDetail" aria-label="Prethodni kandidat">← Prev</button>
      <span id="detailPosition">—</span>
      <button type="button" id="nextDetail" aria-label="Sljedeći kandidat">Next →</button>
    </div>
    <div id="detailBody"></div>
  </dialog>
  <script src="watchlist-store.js"></script>
  <script src="snapshot-loader.js"></script>
  <script src="kell-dataset-loader.js"></script>
  <script src="kell-change-detector.js"></script>
<script src="app.js" defer></script>
</body>
</html>
