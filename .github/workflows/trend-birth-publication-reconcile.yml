name: Trend Birth Production Publication Reconciler

on:
  pull_request:
    paths:
      - "scripts/reconcile_trend_birth_publication.py"
      - "tests/test_reconcile_trend_birth_publication.py"
      - ".github/workflows/trend-birth-publication-reconcile.yml"
  push:
    branches: [main]
    paths:
      - "scripts/reconcile_trend_birth_publication.py"
      - ".github/workflows/trend-birth-publication-reconcile.yml"
  workflow_dispatch:
  schedule:
    # Scheduled Actions run on the default branch, which can safely update
    # the existing production-branch refresh trigger after Unified EOD.
    # Fallback slots after the existing 08:17 production refresher.
    # Never compete with its ordinary on-time execution.
    - cron: "37 9 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "37 10 * * 2-6"
      timezone: "Europe/Zagreb"

permissions:
  contents: read

concurrency:
  group: trend-birth-production-publication-reconciler
  cancel-in-progress: false

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-refresh.lock
      - name: Exercise reconciler with local fixtures
        run: python -m unittest discover -s tests -p 'test_reconcile_trend_birth_publication.py' -v

  reconcile:
    needs: syntax
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-refresh.lock
      - name: Verify Unified exact-run Pages and notification gates, reconcile if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/reconcile_trend_birth_publication.py
