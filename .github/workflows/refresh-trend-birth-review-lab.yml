name: Refresh Trend Birth Review Lab

on:
  workflow_dispatch:
  schedule:
    # Retry after Unified EOD activation; the publisher validates the exact manifest.
    - cron: "17 3 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "17 7 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "17 11 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "17 17 * * 2-6"
      timezone: "Europe/Zagreb"

permissions:
  actions: write
  contents: read

concurrency:
  group: trend-birth-review-lab-refresh
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the sole aligned LAB publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run unified-review-grid-lab.yml --repo "$GITHUB_REPOSITORY" --ref feature/unified-review-grid-lab
