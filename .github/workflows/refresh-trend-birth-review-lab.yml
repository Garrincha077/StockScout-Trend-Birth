name: Refresh Trend Birth Review Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-trend-birth-review-lab.yml"
  schedule:
    # Unified EOD normally starts around 23:30 UTC, which is after midnight in Zagreb.
    # Probe several times on the following local day because upstream duration varies widely.
    - cron: "17 3 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "17 7 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "17 11 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "17 17 * * 2-6"
      timezone: "Europe/Zagreb"

permissions:
  contents: write

concurrency:
  group: trend-birth-review-lab-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated LAB branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-review-grid-lab
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate publication and link contracts
        run: |
          python -m unittest discover -s tests -v
          node --test tests/snapshot-loader.test.cjs

      - name: Build from one activated Unified scan
        run: python scripts/build_review_snapshot.py --output /tmp/review-candidate.json

      - name: Publish immutable snapshot and pointer
        id: publish
        run: python scripts/publish_review_snapshot.py --input /tmp/review-candidate.json --directory lab/data

      - name: Rebuild Trend Birth alert payload for published snapshot
        run: |
          python scripts/build_trend_birth_alerts.py \
            --current /tmp/review-candidate.json \
            --history-dir lab/data/kell-history \
            --publication lab/data/publication.json \
            --output lab/data/trend-birth-alerts.json

      - name: Commit publication and alert payload atomically to LAB branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/data/latest.json lab/data/publication.json lab/data/trend-birth-alerts.json lab/data/snapshots/ lab/data/history/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(lab): publish review snapshot and alert payload"
          git push origin HEAD:feature/unified-review-grid-lab
