name: Unified Review Grid Lab

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/unified-review-grid-lab"
      - "feature/kell-mcp-lab"
      - "fix/kell-review-date-alignment"
      - "feature/persistent-watchlist"
      - "feature/unified-watchlist-integration"
    paths:
      - "lab/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/unified-review-grid-lab.yml"
      - "vercel.json"
  pull_request:
    paths:
      - "lab/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/unified-review-grid-lab.yml"
      - "vercel.json"

permissions:
  contents: write

concurrency:
  group: unified-review-grid-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover verified historical Kell archives
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/kell-mcp-lab'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          sources_path = Path("lab/data/kell-recovery-sources.json")
          if not sources_path.exists():
              print("No Kell recovery source manifest; skipping.")
              raise SystemExit(0)

          manifest = json.loads(sources_path.read_text())
          source_repo = manifest["sourceRepository"]
          output_dir = Path("lab/data/kell-score-history")
          output_dir.mkdir(parents=True, exist_ok=True)
          recovered = []
          skipped = []

          with tempfile.TemporaryDirectory() as tmp:
              tmpdir = Path(tmp)
              for source in manifest.get("sources") or []:
                  session = source["sessionDate"]
                  target = output_dir / f"{session}.json.gz.b64"
                  if target.exists():
                      skipped.append(session)
                      continue

                  artifact_id = int(source["artifactId"])
                  artifact_zip = tmpdir / f"{artifact_id}.zip"
                  endpoint = f"repos/{source_repo}/actions/artifacts/{artifact_id}/zip"
                  print(f"Downloading exact Pages artifact {artifact_id} for {session}...")
                  with artifact_zip.open("wb") as handle:
                      subprocess.run(
                          ["gh", "api", endpoint],
                          stdout=handle,
                          check=True,
                          env={**os.environ, "GH_TOKEN": os.environ["GH_TOKEN"]},
                      )

                  source_url = f"https://api.github.com/repos/{source_repo}/actions/artifacts/{artifact_id}/zip"
                  cmd = [
                      sys.executable,
                      "scripts/recover_kell_history_artifact.py",
                      "--artifact", str(artifact_zip),
                      "--output-dir", str(output_dir),
                      "--encoding", "json-gzip-base64",
                      "--source-repository", source_repo,
                      "--workflow-run-id", str(source["workflowRunId"]),
                      "--workflow-run-number", str(source["workflowRunNumber"]),
                      "--run-attempt", str(source["runAttempt"]),
                      "--head-sha", source["headSha"],
                      "--artifact-id", str(artifact_id),
                      "--artifact-name", source["artifactName"],
                      "--artifact-digest", source["artifactDigest"],
                      "--artifact-created-at", source["artifactCreatedAt"],
                      "--artifact-expires-at", source["artifactExpiresAt"],
                      "--source-path", source_url,
                  ]
                  subprocess.run(cmd, check=True)
                  if not target.exists():
                      raise RuntimeError(f"Recovered artifact did not produce expected session {session}")
                  recovered.append(session)
                  artifact_zip.unlink(missing_ok=True)

          print(json.dumps({
              "status": "ok",
              "recovered": recovered,
              "skippedExisting": skipped,
              "trackedSessionCount": len(list(output_dir.glob("*.json.gz.b64"))),
          }))
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Historical Kell overlay smoke (2026-09-17)
        run: python scripts/kell_scoring.py --input lab/data/history/2026-09-17.json --output /tmp/kell-2026-09-17.json --validate
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser model tests
        run: node --test tests/*.test.cjs
      - name: GridView JavaScript syntax
        run: node --check lab/app.js
      - name: Build read-only snapshot from activated Unified public data
        run: python scripts/build_review_snapshot.py --output lab/data/latest.json
      - name: Publish immutable review snapshot atomically
        run: python scripts/publish_review_snapshot.py --input lab/data/latest.json --directory lab/data
      - name: Build compact Kell preview dataset
        run: python scripts/build_kell_compact.py --input lab/data/latest.json --output lab/data/kell-latest.json --charts-dir lab/data/kell-charts
      - name: Validate compact Kell dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("lab/data/kell-latest.json").read_text())
          assert data["schemaVersion"] == "kell-compact-v5"
          assert data["source"]["sessionDate"]
          assert len(data["kellCandidates"]) == data["kellCandidateCount"]
          chart_meta = data["kellChartData"]
          assert chart_meta["schemaVersion"] == "kell-chart-shard-v2"
          assert chart_meta["chartCandidateCount"] == data["kellCandidateCount"]
          assert chart_meta["weeklyChartCandidateCount"] > 0
          assert chart_meta["shardCount"] > 0
          chart_files = sorted(Path("lab/data/kell-charts").glob("shard-*.json"))
          assert len(chart_files) == chart_meta["shardCount"]
          chart_tickers = set()
          for path in chart_files:
              shard = json.loads(path.read_text())
              assert shard["schemaVersion"] == "kell-chart-shard-v2"
              assert shard["source"]["sessionDate"] == data["source"]["sessionDate"]
              for ticker, chart in shard["charts"].items():
                  assert len(chart.get("daily") or []) >= 2
                  assert len(chart.get("weekly") or []) >= 2
                  chart_tickers.add(ticker)
          assert len(chart_tickers) == data["kellCandidateCount"]
          assert data["kellScoring"]["modelVersion"] == "kell-overlay-v5-quality-readiness-context"
          assert data["kellScoring"]["unifiedCandidateCount"] >= len(data["kellCandidates"])
          assert "kell_doubler_ytd" in data["kellScoring"]["screenCounts"]
          assert "kell_doubler_6m" not in data["kellScoring"]["screenCounts"]
          assert "kell_wedge_pop" in data["kellScoring"]["setupCounts"]
          assert "kell_focus" in data["kellScoring"]["contextCounts"]
          assert data["kellScoring"]["stageCounts"]
          for item in data["kellCandidates"]:
              screens = set(item.get("kellScreens", []))
              setups = set(item.get("kellSetups", []))
              context = set(item.get("kellContext", []))
              assert screens.isdisjoint(setups)
              assert screens.isdisjoint(context)
              assert setups.isdisjoint(context)
              assert (item.get("kell_stage") or {}).get("primary")
              assert 0 <= float(item.get("kell_score") or 0) <= 100
              assert 0 <= float(item.get("kell_quality_score") or 0) <= 100
              assert 0 <= float(item.get("kell_readiness_score") or 0) <= 100
              assert 0 <= float(item.get("kell_context_score") or 0) <= 100
              assert 0 <= float(item.get("kell_evidence_coverage") or 0) <= 100
              assert float(item.get("kell_score") or 0) <= float(item.get("kell_stage_cap") or 100)
              assert isinstance(item.get("chartShard"), int)
              assert item.get("chartBarsCount", 0) >= 2
              assert item.get("weeklyChartBarsCount", 0) >= 2
              assert item["ticker"] in chart_tickers
          print({
              "sessionDate": data["source"]["sessionDate"],
              "kellCandidates": len(data["kellCandidates"]),
              "bytes": Path("lab/data/kell-latest.json").stat().st_size,
          })
          PY
      - name: Validate Unified -> Review -> Kell source identity
        run: python scripts/validate_unified_review_bundle.py --review lab/data/latest.json --publication lab/data/publication.json --kell lab/data/kell-latest.json --charts-dir lab/data/kell-charts
      - name: Publish immutable Kell companion for Review snapshot
        run: python scripts/publish_kell_snapshot.py --publication lab/data/publication.json --kell lab/data/kell-latest.json --charts-dir lab/data/kell-charts --directory lab/data
      - name: Validate Kell signal contracts and setup quality
        run: python scripts/kell_signal_validation.py --input lab/data/latest.json --output lab/data/kell-signal-validation.json --sample-limit 100 --strict
      - name: Build Kell visual calibration report
        run: python scripts/build_kell_calibration_report.py --snapshot lab/data/latest.json --validation lab/data/kell-signal-validation.json --output lab/kell-calibration.html
      - name: Archive point-in-time Kell scores
        run: python scripts/archive_kell_scores.py --input lab/data/kell-latest.json --output-dir lab/data/kell-score-history
      - name: Evaluate human-reviewed Kell Gold Set
        run: |
          python scripts/kell_gold_set.py \
            --gold-set lab/data/kell-gold-set.json \
            --current lab/data/kell-latest.json \
            --scores-dir lab/data/kell-score-history \
            --snapshots-dir lab/data/snapshots \
            --output lab/data/kell-gold-set-eval.json \
            --strict
      - name: Run point-in-time Kell forward validator
        run: |
          python scripts/kell_forward_validation.py \
            --scores-dir lab/data/kell-score-history \
            --charts-dir lab/data/kell-charts \
            --output lab/data/kell-forward-validation.json \
            --horizons 5,10,20,40,60,120 \
            --min-outcome-coverage-pct 99
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("lab/data/kell-forward-validation.json").read_text())
          assert report["schemaVersion"] == "kell-forward-validation-v1"
          assert report["source"]["scoreSnapshotCount"] >= 1
          assert report["source"]["outcomeCoverageGuard"] is True
          assert report["source"]["minOutcomeCoveragePct"] == 99.0
          for horizon in report["horizons"]:
              comparison = report["comparison"][str(horizon)]
              if not comparison["eligibleForValidation"]:
                  assert comparison["v5MinusV4TopDecileMeanReturnPct"] is None
                  assert comparison["v5TopMinusBottomSpreadPct"] is None
                  assert comparison["v4TopMinusBottomSpreadPct"] is None
          print(json.dumps({
              "status": "ok",
              "scoreSnapshots": report["source"]["scoreSnapshotCount"],
              "chartTickers": report["source"]["chartTickerCount"],
              "coverage5D": report["models"]["v5"]["5"]["outcomeCoverage"],
              "eligible5D": report["comparison"]["5"]["eligibleForValidation"],
          }, sort_keys=True))
          PY
      - name: Kell v5 BEFORE/AFTER spot check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("lab/data/kell-latest.json").read_text())
          items = data["kellCandidates"]
          by_ticker = {item["ticker"]: item for item in items}
          watch = ["GRAL", "WBD", "DELL", "VKTX", "AMD", "TARS"]
          print("KELL_V5_SPOT_CHECK")
          for ticker in watch:
              item = by_ticker[ticker]
              breakdown = item.get("score_breakdown") or {}
              print(json.dumps({
                  "ticker": ticker,
                  "legacyV4": breakdown.get("legacy_v4_score"),
                  "focusV5": item.get("kell_score"),
                  "quality": item.get("kell_quality_score"),
                  "readiness": item.get("kell_readiness_score"),
                  "context": item.get("kell_context_score"),
                  "coverage": item.get("kell_evidence_coverage"),
                  "stage": (item.get("kell_stage") or {}).get("primary"),
                  "stageCap": item.get("kell_stage_cap"),
              }, sort_keys=True))
          print("KELL_V5_TOP10")
          for item in sorted(items, key=lambda x: (-float(x.get("kell_score") or 0), x["ticker"]))[:10]:
              breakdown = item.get("score_breakdown") or {}
              print(json.dumps({
                  "ticker": item["ticker"],
                  "legacyV4": breakdown.get("legacy_v4_score"),
                  "focusV5": item.get("kell_score"),
                  "quality": item.get("kell_quality_score"),
                  "readiness": item.get("kell_readiness_score"),
                  "context": item.get("kell_context_score"),
                  "coverage": item.get("kell_evidence_coverage"),
                  "stage": (item.get("kell_stage") or {}).get("primary"),
              }, sort_keys=True))
          PY
      - name: Publish aligned Review + Kell data atomically
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/feature/unified-review-grid-lab' || github.ref == 'refs/heads/feature/kell-mcp-lab' || github.ref == 'refs/heads/fix/kell-review-date-alignment' || github.ref == 'refs/heads/feature/persistent-watchlist' || github.ref == 'refs/heads/feature/unified-watchlist-integration')
        run: |
          mkdir -p /tmp/review-publication
          cp lab/data/latest.json /tmp/review-publication/latest.json
          cp lab/data/publication.json /tmp/review-publication/publication.json
          rm -rf /tmp/review-publication/history /tmp/review-publication/snapshots
          cp -R lab/data/history /tmp/review-publication/history
          cp -R lab/data/snapshots /tmp/review-publication/snapshots
          cp lab/data/kell-latest.json /tmp/kell-latest.json
          cp lab/data/kell-forward-validation.json /tmp/kell-forward-validation.json
          cp lab/data/kell-signal-validation.json /tmp/kell-signal-validation.json
          cp lab/data/kell-gold-set-eval.json /tmp/kell-gold-set-eval.json
          cp lab/kell-calibration.html /tmp/kell-calibration.html
          rm -rf /tmp/kell-charts
          cp -R lab/data/kell-charts /tmp/kell-charts
          rm -rf /tmp/kell-score-history
          cp -R lab/data/kell-score-history /tmp/kell-score-history
          rm -rf /tmp/kell-snapshots /tmp/kell-chart-snapshots /tmp/kell-history
          cp -R lab/data/kell-snapshots /tmp/kell-snapshots
          cp -R lab/data/kell-chart-snapshots /tmp/kell-chart-snapshots
          cp -R lab/data/kell-history /tmp/kell-history
          target_branch="$GITHUB_REF_NAME"
          git fetch origin "$target_branch"
          changed=$(git diff --name-only "$GITHUB_SHA"..origin/"$target_branch" -- lab scripts tests .github/workflows/unified-review-grid-lab.yml vercel.json || true)
          if [ -n "$changed" ]; then
            echo "Branch advanced with executable changes; newer workflow will publish the dataset."
            echo "$changed"
            exit 0
          fi
          git reset --hard
          git checkout -B "$target_branch" origin/"$target_branch"
          cp /tmp/review-publication/latest.json lab/data/latest.json
          cp /tmp/review-publication/publication.json lab/data/publication.json
          rm -rf lab/data/history lab/data/snapshots
          cp -R /tmp/review-publication/history lab/data/history
          cp -R /tmp/review-publication/snapshots lab/data/snapshots
          cp /tmp/kell-latest.json lab/data/kell-latest.json
          cp /tmp/kell-forward-validation.json lab/data/kell-forward-validation.json
          cp /tmp/kell-signal-validation.json lab/data/kell-signal-validation.json
          cp /tmp/kell-gold-set-eval.json lab/data/kell-gold-set-eval.json
          cp /tmp/kell-calibration.html lab/kell-calibration.html
          rm -rf lab/data/kell-charts
          cp -R /tmp/kell-charts lab/data/kell-charts
          rm -rf lab/data/kell-score-history
          cp -R /tmp/kell-score-history lab/data/kell-score-history
          rm -rf lab/data/kell-snapshots lab/data/kell-chart-snapshots lab/data/kell-history
          cp -R /tmp/kell-snapshots lab/data/kell-snapshots
          cp -R /tmp/kell-chart-snapshots lab/data/kell-chart-snapshots
          cp -R /tmp/kell-history lab/data/kell-history
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path("lab/data/latest.json").read_text())
          publication = json.loads(Path("lab/data/publication.json").read_text())
          kell = json.loads(Path("lab/data/kell-latest.json").read_text())
          review_date = latest["source"]["sessionDate"]
          review_run = latest["source"]["runId"]
          review_unified_sha = latest["source"]["unifiedManifestSha256"]
          assert publication["sessionDate"] == review_date
          assert publication["runId"] == review_run
          assert publication["unifiedManifestSha256"] == review_unified_sha
          assert kell["source"]["sessionDate"] == review_date
          assert kell["source"]["runId"] == review_run
          assert kell["source"]["unifiedManifestSha256"] == review_unified_sha
          print({"alignedSessionDate": review_date, "runId": review_run, "unifiedManifestSha256": review_unified_sha})
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/data/latest.json lab/data/publication.json lab/data/history lab/data/snapshots lab/data/kell-latest.json lab/data/kell-signal-validation.json lab/data/kell-gold-set-eval.json lab/data/kell-forward-validation.json lab/kell-calibration.html lab/data/kell-charts lab/data/kell-score-history lab/data/kell-snapshots lab/data/kell-chart-snapshots lab/data/kell-history
          if git diff --cached --quiet; then
            echo "Compact Kell dataset unchanged."
            exit 0
          fi
          git commit -m "chore(lab): publish aligned Review and Kell data"
          git push origin HEAD:"$target_branch"
      - name: Upload review lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: trend-birth-review-grid-lab
          path: |
            lab
            scripts/kell_scoring.py
            scripts/kell_signal_validation.py
            scripts/build_kell_calibration_report.py
            scripts/recover_kell_history_artifact.py
            scripts/kell_forward_validation.py
            scripts/validate_unified_review_bundle.py
            scripts/publish_kell_snapshot.py
          retention-days: 7
