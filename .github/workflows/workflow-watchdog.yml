name: Trend Birth Workflow Watchdog

on:
  workflow_run:
    workflows:
      - Cache Trend Birth Review Snapshot
      - Validate Trend Birth Review Snapshot
      - Unified Review Grid Lab
      - Refresh Trend Birth Review Lab
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  inspect:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      WATCHDOG_RETRY_WORKFLOWS: Validate Trend Birth Review Snapshot,Refresh Trend Birth Review Lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Classify run and record action
        run: python scripts/workflow_watchdog.py
