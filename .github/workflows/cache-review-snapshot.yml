name: Validate Trend Birth Review Snapshot

on:
  pull_request:
    paths:
      - "scripts/build_review_snapshot.py"
      - ".github/workflows/cache-review-snapshot.yml"
      - "lab/refresh-trigger.txt"
  push:
    branches:
      - "feature/unified-review-grid-lab"
    paths:
      - "scripts/build_review_snapshot.py"
      - ".github/workflows/cache-review-snapshot.yml"
      - "lab/refresh-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-trend-birth-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build current read-only snapshot
        run: python scripts/build_review_snapshot.py --output lab/data/latest.json
      - name: Validate immutable publication in temporary directory
        run: python scripts/publish_review_snapshot.py --input lab/data/latest.json --directory /tmp/review-publication
      - uses: actions/upload-artifact@v4
        with:
          name: review-publication-preview
          path: /tmp/review-publication
          retention-days: 7
