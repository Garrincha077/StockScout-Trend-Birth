name: Cache Trend Birth Review Snapshot

on:
  pull_request:
    paths:
      - "scripts/build_review_snapshot.py"
      - ".github/workflows/cache-review-snapshot.yml"
      - "lab/refresh-trigger.txt"
  push:
    branches:
      - "feature/unified-review-grid-lab"
    paths:
      - "scripts/build_review_snapshot.py"
      - ".github/workflows/cache-review-snapshot.yml"
      - "lab/refresh-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build current read-only snapshot
        run: python scripts/build_review_snapshot.py --analysis lab/data/analysis.example.json --output lab/data/latest.json
      - name: Archive immutable session snapshot
        run: |
          SESSION_DATE=$(python -c "import json; print(json.load(open('lab/data/latest.json'))['source']['sessionDate'])")
          mkdir -p lab/data/history
          cp lab/data/latest.json "lab/data/history/${SESSION_DATE}.json"
          echo "Archived ${SESSION_DATE}"
      - name: Commit snapshot only to Trend Birth lab branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/data/latest.json lab/data/history/
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(lab): refresh review snapshot [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
